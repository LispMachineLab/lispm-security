name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Emacs ${{ matrix.emacs }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs: ['30.1', '31.1']
    steps:
      - uses: actions/checkout@v7
      # LispM UI (including Kit), with which Security declares its commands.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-ui
          path: .deps/lispm-ui
      # The agent Security works with, from its own repository, for the
      # tests of how it does.
      - uses: actions/checkout@v7
        with:
          repository: LispMachineLab/lispm-agent
          path: .deps/lispm-agent
      - uses: purcell/setup-emacs@v8.0
        with:
          version: ${{ matrix.emacs }}
      - name: Test
        run: make test compile LISPM_AGENT=.deps/lispm-agent/lisp LISPM_UI=.deps/lispm-ui
